<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrystalFetch | Heavy-Duty Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #020617; 
            background-image: radial-gradient(circle at top right, #0f172a, #020617);
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        }
        .glass { 
            background: rgba(15, 23, 42, 0.7); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.05); 
            border-radius: 1.5rem; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .terminal {
            background: #000000;
            border: 1px solid #333;
            border-radius: 1rem;
            font-family: 'Courier New', Courier, monospace;
            height: 160px;
            overflow-y: auto;
        }
        .input-glow:focus {
            box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-bottom-color: #fff;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            width: 20px;
            height: 20px;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        /* Custom scrollbar for terminal */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #000; border-radius: 10px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 10px; }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center">

    <main class="w-full max-w-xl mx-auto space-y-6">
        <div class="text-center">
            <h1 class="text-4xl font-black text-transparent bg-clip-text bg-gradient-to-r from-cyan-400 to-blue-500 tracking-tight">CrystalFetch</h1>
            <p class="text-slate-500 text-sm mt-1 font-bold uppercase tracking-widest">Heavy-Duty Routing Engine</p>
        </div>

        <div class="glass p-6 relative overflow-hidden">
            <div class="relative flex w-full p-1.5 mb-6 bg-slate-900/80 rounded-2xl border border-slate-700/50 cursor-pointer shadow-inner">
                <div id="slide-bg" class="absolute top-1.5 bottom-1.5 left-1.5 w-[calc(50%-6px)] bg-gradient-to-r from-cyan-500 to-blue-600 rounded-xl transition-transform duration-300 shadow-md"></div>
                <button type="button" id="btn-mp4" onclick="setFormat('mp4')" class="relative flex-1 py-3 text-sm font-bold text-white z-10 transition-colors">🎥 Video (MP4)</button>
                <button type="button" id="btn-mp3" onclick="setFormat('mp3')" class="relative flex-1 py-3 text-sm font-bold text-slate-500 z-10 transition-colors">🎵 Audio (MP3)</button>
            </div>

            <form id="extract-form" onsubmit="download(event)" class="space-y-4 relative z-10">
                <div class="relative">
                    <input type="url" id="url" required placeholder="Paste YouTube link here..." class="input-glow w-full px-5 py-4 bg-slate-900/80 border border-slate-700/50 rounded-2xl text-white outline-none focus:border-cyan-400 transition-all shadow-inner placeholder-slate-600 font-medium">
                </div>
                
                <button type="submit" id="btn" class="group relative w-full flex justify-center items-center gap-2 bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-black py-4 rounded-2xl transition-all shadow-[0_0_20px_rgba(6,182,212,0.3)]">
                    <span id="btn-text">ENGAGE ENGINE</span>
                    <span id="btn-loader" class="loader hidden"></span>
                </button>
            </form>
        </div>

        <div class="terminal p-4 w-full flex flex-col justify-start text-xs text-green-400 space-y-1 shadow-2xl" id="terminal">
            <div class="text-slate-500">System Ready. Awaiting coordinates...</div>
        </div>
        
        <footer class="text-center text-slate-600 text-xs font-bold tracking-widest uppercase">
            © <span id="year"></span> Owner Itz_MeDark
        </footer>
    </main>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        let format = 'mp4';

        // 🟢 THE TANK: A massive decentralized array of pure APIs. No CORS proxies needed.
        const INVIDIOUS_NODES = [
            "https://vid.puffyan.us",
            "https://yewtu.be",
            "https://invidious.flokinet.to",
            "https://invidious.slipfox.xyz",
            "https://invidious.weblibre.org",
            "https://invidious.nerdvpn.de",
            "https://inv.tux.pizza"
        ];

        function setFormat(f) {
            format = f;
            const slideBg = document.getElementById('slide-bg');
            const btnMp4 = document.getElementById('btn-mp4');
            const btnMp3 = document.getElementById('btn-mp3');

            if (f === 'mp4') {
                slideBg.style.transform = 'translateX(0)';
                btnMp4.classList.replace('text-slate-500', 'text-white');
                btnMp3.classList.replace('text-white', 'text-slate-500');
            } else {
                slideBg.style.transform = 'translateX(100%)';
                btnMp3.classList.replace('text-slate-500', 'text-white');
                btnMp4.classList.replace('text-white', 'text-slate-500');
            }
        }

        // Custom Terminal Logger function
        function log(message, type = "info") {
            const term = document.getElementById('terminal');
            const div = document.createElement('div');
            
            // Add timestamps for the industrial feel
            const time = new Date().toLocaleTimeString([], { hour12: false });
            
            if (type === "error") div.className = "text-red-500";
            else if (type === "success") div.className = "text-cyan-400 font-bold";
            else if (type === "warn") div.className = "text-yellow-400";
            
            div.textContent = `[${time}] ${message}`;
            term.appendChild(div);
            term.scrollTop = term.scrollHeight; // Auto-scroll to bottom
        }
        
        async function download(e) {
            e.preventDefault();
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');
            const btn = document.getElementById('btn');
            const urlInput = document.getElementById('url').value;
            
            btnText.textContent = "ROUTING...";
            btnLoader.classList.remove('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');

            log("======================================");
            log(`Initializing CrystalFetch Sequence for ${format.toUpperCase()}`);

            try {
                // 1. Extract exact Video ID to target the API directly
                const videoIdMatch = urlInput.match(/(?:youtu\.be\/|youtube\.com\/(?:.*v=|.*\/|.*vi=|.*u\/\w\/|embed\/|v=))([^#\&\?]*).*/);
                const videoId = (videoIdMatch && videoIdMatch[1].length === 11) ? videoIdMatch[1] : null;

                if (!videoId) throw new Error("Invalid URL signature detected.");
                log(`Target Locked: ID [${videoId}]`);

                let finalDownloadUrl = null;

                // 2. THE TANK LOOP: Intelligently cycles through APIs until one gives the pure file
                for (let i = 0; i < INVIDIOUS_NODES.length; i++) {
                    const node = INVIDIOUS_NODES[i];
                    log(`Ping Node ${i+1}/${INVIDIOUS_NODES.length}: ${node}...`, "warn");
                    
                    try {
                        // We use AbortController to kill dead nodes after 4 seconds so you don't wait forever
                        const controller = new AbortController();
                        const timeoutId = setTimeout(() => controller.abort(), 4000);

                        const response = await fetch(`${node}/api/v1/videos/${videoId}`, { signal: controller.signal });
                        clearTimeout(timeoutId);

                        if (!response.ok) {
                            log(`Node rejected connection (Status ${response.status}).`, "error");
                            continue; // Instantly move to the next node
                        }

                        // 🟢 THIS PREVENTS THE '<' ERROR: We verify the data is actually JSON before parsing!
                        const contentType = response.headers.get("content-type");
                        if (!contentType || !contentType.includes("application/json")) {
                            log(`Node returned HTML shield. Bypassing...`, "error");
                            continue; 
                        }

                        const data = await response.json();

                        if (format === 'mp4' && data.formatStreams) {
                            // Target 720p (itag 22) or 360p (itag 18) pre-muxed video
                            const stream = data.formatStreams.find(s => s.itag === 22) || data.formatStreams.find(s => s.itag === 18) || data.formatStreams[0];
                            if (stream) finalDownloadUrl = stream.url;
                        } else if (format === 'mp3' && data.adaptiveFormats) {
                            // Target pure m4a audio (itag 140)
                            const audio = data.adaptiveFormats.find(s => s.itag === 140) || data.adaptiveFormats.find(s => s.type.includes('audio'));
                            if (audio) finalDownloadUrl = audio.url;
                        }

                        if (finalDownloadUrl) {
                            log(`SUCCESS: Payload extracted from ${node}`, "success");
                            break; // We found the link, stop the loop!
                        } else {
                            log(`Node had no valid media formats.`, "error");
                        }

                    } catch (err) {
                        log(`Node timeout or offline. Advancing array...`, "error");
                    }
                }

                // 3. Launch payload
                if (finalDownloadUrl) {
                    log(`Handshake complete. Launching file transfer...`, "success");
                    btnText.textContent = "DOWNLOAD SECURED";
                    
                    // Small delay so you can read the success log
                    setTimeout(() => {
                        window.location.href = finalDownloadUrl;
                        
                        // Reset button
                        btnText.textContent = "ENGAGE ENGINE";
                        btnLoader.classList.add('hidden');
                        btn.disabled = false;
                        btn.classList.remove('opacity-80', 'cursor-not-allowed');
                    }, 1500);

                } else {
                    throw new Error("All array nodes failed. Video may be age-restricted or copyright blocked.");
                }

            } catch (err) {
                log(`CRITICAL FAILURE: ${err.message}`, "error");
                btnText.textContent = "ENGAGE ENGINE";
                btnLoader.classList.add('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
