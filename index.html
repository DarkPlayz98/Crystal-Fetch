<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CrystalFetch | Native Serverless</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { 
            background-color: #0f172a; 
            background-image: radial-gradient(circle at top right, #1e293b, #0f172a);
            color: #f8fafc; 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; 
        }
        .glass { 
            background: rgba(30, 41, 59, 0.6); 
            backdrop-filter: blur(20px); 
            -webkit-backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1); 
            border-radius: 1.5rem; 
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
        }
        .input-glow:focus {
            box-shadow: 0 0 15px rgba(6, 182, 212, 0.3);
        }
        .loader {
            border: 3px solid rgba(255,255,255,0.1);
            border-bottom-color: #fff;
            border-radius: 50%;
            display: inline-block;
            box-sizing: border-box;
            animation: rotation 1s linear infinite;
            width: 20px;
            height: 20px;
        }
        @keyframes rotation {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="min-h-screen p-4 flex flex-col items-center justify-center">

    <main class="w-full max-w-xl mx-auto space-y-8">
        <div class="text-center">
            <div class="inline-flex items-center justify-center p-3 mb-4 rounded-full bg-slate-800/50 border border-slate-700/50 shadow-lg">
                <svg class="w-8 h-8 text-cyan-400" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
            </div>
            <h1 class="text-4xl font-extrabold text-transparent bg-clip-text bg-gradient-to-r from-blue-400 via-cyan-300 to-teal-300 tracking-tight">CrystalFetch</h1>
            <p class="text-slate-400 text-sm mt-2 font-medium">Decentralized Serverless Core</p>
        </div>

        <div class="glass p-6 md:p-8 relative overflow-hidden">
            <div class="absolute -top-20 -right-20 w-40 h-40 bg-cyan-500 rounded-full mix-blend-multiply filter blur-3xl opacity-20 pointer-events-none"></div>
            
            <div class="relative flex w-full p-1.5 mb-8 bg-slate-900/60 rounded-2xl border border-slate-700/50 cursor-pointer shadow-inner">
                <div id="slide-bg" class="absolute top-1.5 bottom-1.5 left-1.5 w-[calc(50%-6px)] bg-gradient-to-r from-blue-600 to-cyan-500 rounded-xl transition-transform duration-300 ease-[cubic-bezier(0.4,0,0.2,1)] shadow-md"></div>
                <button type="button" id="btn-mp4" onclick="setFormat('mp4')" class="relative flex-1 py-3 text-sm font-bold text-white z-10 transition-colors duration-300">🎥 Video (MP4)</button>
                <button type="button" id="btn-mp3" onclick="setFormat('mp3')" class="relative flex-1 py-3 text-sm font-bold text-slate-400 z-10 transition-colors duration-300">🎵 Audio (MP3)</button>
            </div>

            <form id="extract-form" onsubmit="download(event)" class="space-y-5 relative z-10">
                <div class="relative">
                    <div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none">
                        <svg class="h-5 w-5 text-slate-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13.828 10.172a4 4 0 00-5.656 0l-4 4a4 4 0 105.656 5.656l1.102-1.101m-.758-4.899a4 4 0 005.656 0l4-4a4 4 0 00-5.656-5.656l-1.1 1.1"></path></svg>
                    </div>
                    <input type="url" id="url" required placeholder="Paste YouTube link here..." class="input-glow w-full pl-11 pr-4 py-4 bg-slate-900/60 border border-slate-700/50 rounded-2xl text-white outline-none focus:border-cyan-500 transition-all shadow-inner placeholder-slate-500 font-medium">
                </div>
                
                <button type="submit" id="btn" class="group relative w-full flex justify-center items-center gap-2 bg-gradient-to-r from-blue-600 to-cyan-500 hover:from-blue-500 hover:to-cyan-400 text-white font-bold py-4 rounded-2xl transition-all shadow-lg hover:shadow-cyan-500/25 transform hover:-translate-y-0.5">
                    <span id="btn-text">Extract Media</span>
                    <span id="btn-loader" class="loader hidden"></span>
                    <svg id="btn-icon" class="w-5 h-5 group-hover:translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>
                </button>
            </form>

            <div id="status" class="hidden mt-5 text-center p-4 rounded-2xl text-sm font-semibold transition-all border"></div>
        </div>
        
        <footer class="text-center text-slate-500 text-xs font-semibold tracking-wider uppercase">
            © <span id="year"></span> Owner Crystal Inc.
        </footer>
    </main>

    <script>
        document.getElementById('year').textContent = new Date().getFullYear();
        let format = 'mp4';

        // 🟢 The Decentralized Proxy Cluster
        const PROXY_NODES = [
            'https://pipedapi.kavin.rocks',
            'https://pipedapi.tokhmi.xyz',
            'https://api.piped.projectsegfau.lt'
        ];

        function setFormat(f) {
            format = f;
            const slideBg = document.getElementById('slide-bg');
            const btnMp4 = document.getElementById('btn-mp4');
            const btnMp3 = document.getElementById('btn-mp3');

            if (f === 'mp4') {
                slideBg.style.transform = 'translateX(0)';
                btnMp4.classList.replace('text-slate-400', 'text-white');
                btnMp3.classList.replace('text-white', 'text-slate-400');
            } else {
                slideBg.style.transform = 'translateX(100%)';
                btnMp3.classList.replace('text-slate-400', 'text-white');
                btnMp4.classList.replace('text-white', 'text-slate-400');
            }
        }
        
        async function download(e) {
            e.preventDefault();
            const btnText = document.getElementById('btn-text');
            const btnLoader = document.getElementById('btn-loader');
            const btnIcon = document.getElementById('btn-icon');
            const btn = document.getElementById('btn');
            const status = document.getElementById('status');
            const urlInput = document.getElementById('url').value;
            
            btnText.textContent = "Routing through Proxies...";
            btnLoader.classList.remove('hidden');
            btnIcon.classList.add('hidden');
            btn.disabled = true;
            btn.classList.add('opacity-80', 'cursor-not-allowed');
            status.classList.add('hidden');

            try {
                // 1. Extract Video ID natively in the browser
                const videoIdMatch = urlInput.match(/(?:youtu\.be\/|youtube\.com\/(?:.*v=|.*\/|.*vi=|.*u\/\w\/|embed\/|v=))([^#\&\?]*).*/);
                const videoId = (videoIdMatch && videoIdMatch[1].length === 11) ? videoIdMatch[1] : null;

                if (!videoId) throw new Error("Invalid YouTube link.");

                let finalDownloadUrl = null;

                // 2. Automated Proxy Hunting
                for (let node of PROXY_NODES) {
                    try {
                        console.log(`Checking Node: ${node}`);
                        const response = await fetch(`${node}/streams/${videoId}`);
                        const data = await response.json();

                        if (data && data.videoStreams) {
                            if (format === 'mp3') {
                                // Find highest quality audio
                                const audio = data.audioStreams.find(s => s.mimeType.includes('mp4') || s.mimeType.includes('webm')) || data.audioStreams[0];
                                if (audio) finalDownloadUrl = audio.url;
                            } else {
                                // Find best video that also has sound (videoOnly === false)
                                const video = data.videoStreams.find(s => s.videoOnly === false) || data.videoStreams[0];
                                if (video) finalDownloadUrl = video.url;
                            }
                            
                            if (finalDownloadUrl) break; // Break loop if we got a link!
                        }
                    } catch (err) {
                        console.log(`Node blocked, jumping to next...`);
                        continue;
                    }
                }

                if (finalDownloadUrl) {
                    status.textContent = "✅ File Secured! Downloading...";
                    status.className = "mt-5 text-center p-4 rounded-2xl text-sm font-bold text-teal-300 bg-teal-500/10 border-teal-500/20 shadow-[0_0_15px_rgba(45,212,191,0.1)] block";
                    window.location.href = finalDownloadUrl;
                } else {
                    throw new Error("All proxy networks are currently rotating. Try again in 60 seconds.");
                }

            } catch (err) {
                status.textContent = "❌ " + err.message;
                status.className = "mt-5 text-center p-4 rounded-2xl text-sm font-bold text-rose-400 bg-rose-500/10 border-rose-500/20 shadow-[0_0_15px_rgba(251,113,133,0.1)] block";
            } finally {
                btnText.textContent = "Extract Media";
                btnLoader.classList.add('hidden');
                btnIcon.classList.remove('hidden');
                btn.disabled = false;
                btn.classList.remove('opacity-80', 'cursor-not-allowed');
            }
        }
    </script>
</body>
</html>
